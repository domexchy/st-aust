<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Manager | St. Augustine Academy Admin</title>
  <meta name="description" content="Upload and manage school gallery photos and campus life media.">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-body">

  <!-- Authentication Loading Overlay -->
  <div id="admin-auth-loading" style="position: fixed; inset: 0; background: #0f172a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffffff;">
    <div class="btn-spinner" style="width: 36px; height: 36px; border-width: 3px; border-color: var(--color-accent); border-right-color: transparent; margin-bottom: 1rem;"></div>
    <p style="font-size: 0.95rem; color: #cbd5e1;">Verifying administrator credentials...</p>
  </div>

  <!-- Shared Admin Header -->
  <header class="admin-header">
    <div class="admin-header-inner">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <a href="dashboard.html" class="admin-brand">
          <div class="brand-crest" style="width: 32px; height: 32px; font-size: 0.85rem;" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          </div>
          <span>St. Augustine</span>
          <span class="admin-badge">Admin</span>
        </a>

        <nav class="admin-nav" aria-label="Admin Navigation">
          <a href="dashboard.html" class="admin-nav-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span>Dashboard</span>
          </a>
          <a href="news.html" class="admin-nav-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1m2 13a2 2 0 0 1-2-2V7m2 13a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
            <span>News</span>
          </a>
          <a href="events.html" class="admin-nav-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>Events</span>
          </a>
          <a href="gallery.html" class="admin-nav-link active">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span>Gallery</span>
          </a>
          <a href="messages.html" class="admin-nav-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Messages</span>
          </a>
          <a href="applications.html" class="admin-nav-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <span>Applications</span>
          </a>
        </nav>
      </div>

      <div class="admin-user-bar">
        <div class="admin-user-info">
          <span id="admin-user-name" class="admin-user-name">Administrator</span>
          <span id="admin-user-role" class="admin-user-role">admin</span>
        </div>
        <button type="button" id="logout-btn" class="btn btn-outline btn-sm admin-logout-btn" style="border-color: #334155; color: #f8fafc; font-size: 0.8rem; padding: 6px 12px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span>Log Out</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="admin-main">
    <div class="admin-page-header">
      <div>
        <h1 class="admin-title">Campus Photo Gallery</h1>
        <p class="admin-subtitle">Curate and publish photos showing campus life, facilities, and school activities.</p>
      </div>
      <div>
        <button type="button" id="btn-add-gallery" class="btn btn-primary" style="gap: 6px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>Upload Photos</span>
        </button>
      </div>
    </div>

    <!-- Gallery Grid -->
    <div id="gallery-grid" class="admin-gallery-grid" aria-label="Admin Gallery Photo Grid">
      <div style="grid-column: 1/-1; text-align: center; padding: 2rem;">Loading gallery photos...</div>
    </div>
  </main>

  <!-- Gallery Upload Modal -->
  <div id="gallery-modal" class="admin-modal-backdrop" hidden>
    <div class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="gallery-modal-title">
      <div class="admin-modal-header">
        <h2 id="gallery-modal-title" class="admin-modal-title">Add Photo to Gallery</h2>
        <button type="button" id="btn-close-gallery-modal" class="btn-close-modal" aria-label="Close modal">&times;</button>
      </div>

      <form id="gallery-form" novalidate>
        <div class="admin-modal-body">
          <div id="gallery-form-status" class="form-status-msg" role="status"></div>

          <div class="form-group">
            <label for="gallery-album" class="form-label">
              <span>Album Category</span>
              <span class="required-star">*</span>
            </label>
            <select id="gallery-album" class="form-control" required>
              <option value="Campus Life">Campus Life</option>
              <option value="Academics">Academics & Classrooms</option>
              <option value="Sports & Athletics">Sports & Athletics</option>
              <option value="Arts & Music">Arts, Music & Culture</option>
              <option value="Facilities">Modern Facilities & Labs</option>
            </select>
          </div>

          <div class="form-group">
            <label for="gallery-caption" class="form-label">
              <span>Photo Caption</span>
            </label>
            <input type="text" id="gallery-caption" class="form-control" placeholder="e.g. Students in the advanced robotics suite">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="gallery-url" class="form-label">
                <span>Image Web URL</span>
              </label>
              <input type="url" id="gallery-url" class="form-control" placeholder="https://example.com/photo.jpg">
            </div>

            <div class="form-group">
              <label for="gallery-file" class="form-label">
                <span>Or Upload Local Image</span>
              </label>
              <input type="file" id="gallery-file" class="form-control" accept="image/*" style="padding-top: 0.5rem;">
            </div>
          </div>

          <div class="form-group" style="margin-top: 0.5rem;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 600;">
              <input type="checkbox" id="gallery-is-published" checked style="width: 18px; height: 18px;">
              <span>Publish immediately in the public gallery</span>
            </label>
          </div>
        </div>

        <div class="admin-modal-footer">
          <button type="button" id="btn-cancel-gallery-modal" class="btn btn-outline">Cancel</button>
          <button type="submit" id="gallery-submit-btn" class="btn btn-primary">Add Photo to Gallery</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { checkAdminAuth, initGalleryManager } from '../js/admin.js';
    const auth = await checkAdminAuth();
    if (auth) {
      initGalleryManager();
    }
  </script>
</body>
</html>

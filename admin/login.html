<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin & Staff Login | St. Augustine International Academy</title>
  <meta name="description" content="Private administration portal login for St. Augustine International Academy staff.">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #0f172a; padding: 1.5rem; background-image: radial-gradient(circle at 50% 20%, rgba(201, 151, 0, 0.12) 0%, transparent 60%);">

  <div class="card" style="max-width: 440px; width: 100%; padding: 2.5rem 2rem; border-radius: var(--radius-xl); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); background-color: #ffffff;">
    
    <!-- Portal Brand Crest -->
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div class="brand-crest" style="margin: 0 auto 1rem auto; width: 54px; height: 54px; font-size: 1.5rem;" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="admin-badge" style="margin-bottom: 0.5rem;">Administrative Portal</span>
      <h1 style="font-size: 1.5rem; color: #0f172a; margin-top: 0.5rem; margin-bottom: 0.25rem;">Staff & Admin Login</h1>
      <p style="font-size: 0.875rem; color: #64748b; margin-bottom: 0;">Sign in to manage news, events, media, and school inquiries.</p>
    </div>

    <!-- Status Alert Banner -->
    <div id="login-status-msg" class="form-status-msg" role="status" aria-live="polite"></div>

    <!-- Login Form -->
    <form id="admin-login-form" novalidate aria-label="Administrative Staff Login Form">
      <div class="form-group">
        <label for="login-email" class="form-label">
          <span>Official Email Address</span>
          <span class="required-star" aria-hidden="true">*</span>
        </label>
        <input 
          type="email" 
          id="login-email" 
          name="email" 
          class="form-control" 
          placeholder="admin@staugustine.edu" 
          required 
          autocomplete="username">
      </div>

      <div class="form-group">
        <label for="login-password" class="form-label">
          <span>Password</span>
          <span class="required-star" aria-hidden="true">*</span>
        </label>
        <input 
          type="password" 
          id="login-password" 
          name="password" 
          class="form-control" 
          placeholder="••••••••••••" 
          required 
          autocomplete="current-password">
      </div>

      <div style="margin-top: 1.5rem; margin-bottom: 1.5rem;">
        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg" style="justify-content: center;">
          <span>Sign In to Dashboard</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>
    </form>

    <div style="text-align: center; border-top: 1px solid #f1f5f9; padding-top: 1.25rem;">
      <a href="../index.html" style="font-size: 0.85rem; color: #64748b; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
        <span>Return to Public Website</span>
      </a>
    </div>
  </div>

  <script type="module">
    import { initLoginForm } from '../js/admin.js';
    initLoginForm();
  </script>
</body>
</html>
